name: Gerar ClinicaUpdate Semanal

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gerar
        run: python generate.py
      - name: Publicar
        run: |
          git config user.name "ClinicaUpdate Bot"
          git config user.email "bot@clinicaupdate"
          git add docs/
          git diff --cached --quiet || git commit -m "Edicao $(date +'%Y-%m-%d')"
          git push
