name: Gerar ClinicaUpdate Semanal

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python generate.py
      - run: |
          git config user.name "ClinicaUpdate Bot"
          git config user.email "bot@clinicaupdate"
          git add docs/
          git diff --cached --quiet || git commit -m "Edição $(date +'%Y-%m-%d')"
          git push
